name: Auto Tag on Push

on:
  push:
    branches: ['**']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: tag
        run: |
          if git rev-parse "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.tag.outputs.exists == 'false'
        with:
          distribution: temurin
          java-version: 25
          cache: gradle

      - name: Extract release notes
        if: steps.tag.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          awk -v v="$v" '
            /^# /{
              if (found) exit
              if ($0 == "# Version " v) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "Release $v" > release_notes.md

      - name: Build
        if: steps.tag.outputs.exists == 'false'
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Create tag and release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body_path: release_notes.md
          files: build/libs/*.jar